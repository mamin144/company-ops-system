services:

  postgres:
    image: postgres:16-alpine
    container_name: company-ops-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Host access for admin tools only (localhost); the API always uses the
    # service hostname `postgres`, and 5433 avoids clashing with a host PG.
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: .
      dockerfile: Dockerfile.api

    container_name: company-ops-api

    restart: unless-stopped

    environment:
      NODE_ENV: production
      # nginx proxies to api:4000 — server.ts defaults to 4001, so pin it here
      PORT: 4000
      # Service hostname `postgres`, never localhost (that is the API itself)
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}

    depends_on:
      postgres:
        condition: service_healthy

    expose:
      - "4000"

    volumes:
      - ./apps/api/data:/app/apps/api/data
      - ./apps/api/storage:/app/apps/api/storage
      - ./apps/api/temp:/app/apps/api/temp


  web:
    build:
      context: .
      dockerfile: Dockerfile.web

    container_name: company-ops-web

    restart: unless-stopped

    depends_on:
      - api

    ports:
      - "8080:80"

volumes:
  pgdata:
