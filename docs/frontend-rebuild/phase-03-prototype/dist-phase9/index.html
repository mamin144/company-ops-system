    <script>
      // Phase 5: pre-paint language restore. The default (ar/rtl) is corrected
      // to the saved choice BEFORE any paint so a saved-English reload never
      // flashes the shell in RTL Arabic. Must mirror src/i18n/direction.ts
      // exactly: PERSISTENCE_KEY + dirFor. Invalid/missing values keep the
      // defaults; storage failures (privacy mode, disabled storage) are
      // swallowed — React's LangProvider re-appplies direction on mount.
      (function () {
        try {
          var l = localStorage.getItem('cos-proto-lang');
          if (l === 'en' || l === 'ar') {
            document.documentElement.lang = l;
            document.documentElement.dir = l === 'en' ? 'ltr' : 'rtl';
          }
        } catch (e) { /* keep ar/rtl defaults */ }
      })();
    </script>
